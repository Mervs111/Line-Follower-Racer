; Firmware LFM X1: ESP32 DevKit 30 pin (CH340/CP2102), bukan ESP32-S3.
; Build:  pio run            upload: pio run -t upload       serial: pio device monitor
;
; env:x1          Arduino-ESP32 core 2.0.x (platform espressif32 6.x resmi PlatformIO)
; env:x1_terbaru  core terbaru dari pioarduino "stable" (28/11/2026 = core 4.0.0), untuk cek jalur API core >= 3.
;                 Unduhan besar. Di Windows jalankan dari PowerShell/CMD, bukan Git Bash (idf_tools menolak MSys).
;                 Build pertama env ini kadang berakhir "TypeError ... NoneType": jalankan ulang, kedua kali sukses.
; Library harus jalan di core lama dan baru (aturan CLAUDE.md), karena versi core di Mind+ belum pasti.

[platformio]
default_envs = x1

[env]
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = olikraus/U8g2@^2.35.30
build_src_flags = -Wall -Wextra

[env:x1]
platform = espressif32@^6.9.0

[env:x1_terbaru]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
